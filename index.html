<!DOCTYPE html>
<html lang="my">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>မြန်မာ့ရှေ့ဆောင်ဘဏ် (MOB) Bank - ယာဉ်သုံးစွဲမှုမှတ်တမ်း</title>
    <!-- Leaflet CSS (Map အတွက်) -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        * { box-sizing: border-box; font-family: 'Pyidaungsu', 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: #f4f6f9; margin: 0; padding: 12px; }
        .container { max-width: 500px; margin: 0 auto; background: #fff; padding: 15px; border-radius: 12px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        .header { text-align: center; color: #a80000; font-weight: bold; }
        .header h2 { margin: 5px 0; font-size: 18px; }
        .header h3 { margin: 0 0 10px 0; font-size: 16px; color: #002b66; }
        select, input { width: 100%; padding: 10px; margin: 6px 0; border: 1px solid #ccc; border-radius: 6px; font-size: 14px; }
        .row { display: flex; gap: 10px; align-items: center; }
        .date-text { color: #a80000; font-weight: bold; text-align: right; white-space: nowrap; }
        
        /* GPS Section */
        .gps-box { background: #eef9f1; border: 1px solid #b7e4c7; border-radius: 8px; padding: 10px; margin: 10px 0; }
        .gps-title { color: #2d6a4f; font-weight: bold; margin-bottom: 5px; }
        .btn-gps { width: 100%; background: #d90429; color: white; padding: 10px; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; }
        .btn-gps.active { background: #2b9348; }
        #map { height: 180px; border-radius: 8px; margin-top: 8px; border: 1px solid #ccc; }
        
        /* Form Section */
        .auto-km { background: #f0f0f0; color: #a80000; font-weight: bold; }
        .btn-save { background: #d90429; color: white; border: none; width: 100%; padding: 12px; font-size: 16px; border-radius: 6px; font-weight: bold; cursor: pointer; margin-top: 10px; }
        .btn-print { background: #0056b3; color: white; border: none; width: 100%; padding: 10px; border-radius: 6px; font-weight: bold; cursor: pointer; margin: 10px 0; }
        .btn-backup { background: #2b9348; color: white; border: none; width: 100%; padding: 10px; border-radius: 6px; font-weight: bold; cursor: pointer; }
        
        /* Table Section */
        .table-container { overflow-x: auto; margin-top: 10px; }
        table { width: 100%; border-collapse: collapse; font-size: 12px; text-align: center; }
        th, td { border: 1px solid #ddd; padding: 8px; }
        th { background-color: #f2f2f2; }
        .action-btn { cursor: pointer; border: none; background: none; font-size: 14px; }
        .edit-btn { color: #0056b3; margin-right: 5px; }
        .del-btn { color: #d90429; }
    </style>
</head>
<body>

<div class="container">
    <!-- Header Section -->
    <div class="header">
        <h2>မြန်မာ့ရှေ့ဆောင်ဘဏ်</h2>
        <h3>( M O B ) Bank</h3>
        <select id="branchSelect">
            <option value="မြောက်ဥက္ကလာပဘဏ်ခွဲ">မြောက်ဥက္ကလာပဘဏ်ခွဲ</option>
            <option value="ဗဟန်းဘဏ်ခွဲ">ဗဟန်းဘဏ်ခွဲ</option>
            <option value="လှိုင်ဘဏ်ခွဲ">လှိုင်ဘဏ်ခွဲ</option>
        </select>
        <p style="text-decoration: underline; font-weight: bold; font-size: 14px;">မော်တော်ယာဉ်သုံးစွဲမှုမှတ်တမ်း</p>
    </div>

    <!-- Vehicle & Date -->
    <div class="row">
        <input type="text" id="vehicleNo" value="5P/4779" placeholder="ယာဉ်အမှတ်">
        <div class="date-text" id="currentDate">ရက်စွဲ - --/--/----</div>
    </div>

    <!-- Real-Time GPS Tracking -->
    <div class="gps-box">
        <div class="gps-title">📍 Real-Time GPS Tracking</div>
        <button id="gpsBtn" class="btn-gps" onclick="toggleGPS()">⏹ GPS လွင့်ခြင်း ရပ်မည်</button>
        <div id="gpsStatus" style="font-size: 12px; margin-top: 5px; color: #555;">🟡 GPS စတင်လွင့်နေပါသည်။ တည်နေရာ ရှာယူနေသည်...</div>
        <div id="map"></div>
    </div>

    <!-- Inputs -->
    <div class="row">
        <input type="number" id="startKm" placeholder="Km (စမှတ် - မှ)" oninput="calculateKm()">
        <button onclick="fetchLastKm()" style="width: auto; white-space: nowrap; font-size: 11px; padding: 5px;">နောက်ဆုံး KM ယူမည်</button>
    </div>
    <input type="number" id="endKm" placeholder="Km (ဆုံးမှတ် - ထိ)" oninput="calculateKm()">
    
    <label style="font-size: 12px; color: #a80000; font-weight: bold;">အသုံးပြု KM (Auto - အလိုအလျောက်တွက်ချက်မည်)</label>
    <input type="number" id="usedKm" class="auto-km" value="0" readonly>

    <input type="number" id="fuelLiter" step="0.1" placeholder="ထည့်သွင်း ဆီလီတာ (L)">
    <input type="text" id="userName" placeholder="သုံးစွဲသူ လက်မှတ်/အမည်">
    <input type="text" id="driverName" placeholder="ယာဉ်မောင်း လက်မှတ်/အမည် (Driver)">

    <!-- Save Button -->
    <button class="btn-save" onclick="saveRecord()">💾 စာရင်းမှတ်တမ်း သိမ်းဆည်းမည်</button>

    <!-- Search & Backup -->
    <input type="text" id="searchInput" placeholder="🔍 Driver အမည် / အသုံးပြုသူ ဖြင့်ရှာရန်..." oninput="renderTable()" style="margin-top: 15px;">
    <button class="btn-backup" onclick="exportData()">📦 Data Backup ယူမည် (JSON)</button>

    <!-- Table -->
    <div style="margin-top: 15px; font-weight: bold;">📋 မှတ်တမ်းဇယား</div>
    <button class="btn-print" onclick="window.print()">🖨️ Print / PDF ဖိုင်ထုတ်မည်</button>

    <div class="table-container">
        <table>
            <thead>
                <tr>
                    <th>Km မှ</th>
                    <th>Km ထိ</th>
                    <th>အသုံးပြု KM</th>
                    <th>ထည့်သွင်းဆီလီတာ (L)</th>
                    <th>သုံးစွဲသူ</th>
                    <th>ယာဉ်မောင်း</th>
                    <th>ပြင်/ဖျက်</th>
                </tr>
            </thead>
            <tbody id="recordTableBody">
                <!-- Dynamic Data -->
            </tbody>
        </table>
    </div>
    <button onclick="clearAllData()" style="background: #6c757d; color: white; border: none; padding: 8px; border-radius: 4px; margin-top: 10px; width: 100%; font-size: 12px;">🗑️ စာရင်းအားလုံးရှင်းမည်</button>
</div>

<!-- Leaflet JS -->
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
    let map, marker;
    let gpsWatchId = null;
    let isGpsActive = false;
    let records = JSON.parse(localStorage.getItem('mob_vehicle_records')) || [];
    let editIndex = null;

    // Load Initial Date & Setup Map
    window.onload = function() {
        const today = new Date();
        const formattedDate = `${today.getDate().toString().padStart(2, '0')}-${(today.getMonth()+1).toString().padStart(2, '0')}-${today.getFullYear()}`;
        document.getElementById('currentDate').innerText = `ရက်စွဲ - ${formattedDate}`;

        initMap();
        startGPS();
        renderTable();
    };

    // Initialize Leaflet Map
    function initMap() {
        // Default Yangon Coordinates
        map = L.map('map').setView([16.8409, 96.1735], 14);
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '© OpenStreetMap contributors'
        }).addTo(map);

        marker = L.marker([16.8409, 96.1735]).addTo(map)
            .bindPopup('မော်တော်ယာဉ် တည်နေရာ')
            .openPopup();
    }

    // Toggle GPS
    function toggleGPS() {
        if (isGpsActive) {
            stopGPS();
        } else {
            startGPS();
        }
    }

    // Start Real-Time Geolocation
    function startGPS() {
        if ("geolocation" in navigator) {
            isGpsActive = true;
            document.getElementById('gpsBtn').innerText = "🟢 GPS ဖွင့်ထားသည် (ရပ်ရန်နှိပ်ပါ)";
            document.getElementById('gpsBtn').style.background = "#2b9348";
            document.getElementById('gpsStatus').innerText = "🟢 GPS တည်နေရာ ဖမ်းယူနေပါသည်...";

            gpsWatchId = navigator.geolocation.watchPosition(
                (position) => {
                    const lat = position.coords.latitude;
                    const lng = position.coords.longitude;
                    
                    const newLatLng = new L.LatLng(lat, lng);
                    marker.setLatLng(newLatLng);
                    map.setView(newLatLng, 16);
                    document.getElementById('gpsStatus').innerText = `📍 တည်နေရာ မှန်ကန်ပါသည် (Lat: ${lat.toFixed(4)}, Lng: ${lng.toFixed(4)})`;
                },
                (error) => {
                    document.getElementById('gpsStatus').innerText = "⚠️ GPS တည်နေရာ ရယူ၍မရပါ ( Location Permission ကို Allow ပေးပါ )";
                },
                { enableHighAccuracy: true, timeout: 10000, maximumAge: 0 }
            );
        } else {
            alert("သင့် Browser တွင် GPS စနစ် မပံ့ပိုးပါ။");
        }
    }

    // Stop GPS
    function stopGPS() {
        if (gpsWatchId !== null) {
            navigator.geolocation.clearWatch(gpsWatchId);
            gpsWatchId = null;
        }
        isGpsActive = false;
        document.getElementById('gpsBtn').innerText = "🟧 GPS လွင့်ခြင်း စတင်မည်";
        document.getElementById('gpsBtn').style.background = "#d90429";
        document.getElementById('gpsStatus').innerText = "🔴 GPS ပိတ်ထားပါသည်";
    }

    // Auto Calculate KM
    function calculateKm() {
        const start = parseFloat(document.getElementById('startKm').value) || 0;
        const end = parseFloat(document.getElementById('endKm').value) || 0;
        const used = end >= start ? end - start : 0;
        document.getElementById('usedKm').value = used;
    }

    // Fetch Last Recorded KM
    function fetchLastKm() {
        if (records.length > 0) {
            const lastRecord = records[records.length - 1];
            document.getElementById('startKm').value = lastRecord.endKm;
            calculateKm();
        } else {
            alert("ယခင် မှတ်တမ်းမရှိသေးပါ။");
        }
    }

    // Save Record to LocalStorage
    function saveRecord() {
        const startKm = document.getElementById('startKm').value;
        const endKm = document.getElementById('endKm').value;
        const usedKm = document.getElementById('usedKm').value;
        const fuelLiter = document.getElementById('fuelLiter').value || "0";
        const userName = document.getElementById('userName').value || "-";
        const driverName = document.getElementById('driverName').value || "-";

        if (!startKm || !endKm) {
            alert("ကျေးဇူးပြု၍ KM အစနှင့် အဆုံး ဖြည့်စွက်ပါ။");
            return;
        }

        const dataObj = { startKm, endKm, usedKm, fuelLiter, userName, driverName };

        if (editIndex !== null) {
            // Edit existing record
            records[editIndex] = dataObj;
            editIndex = null;
            alert("မှတ်တမ်း ပြင်ဆင်ပြီးပါပြီ။");
        } else {
            // Add new record
            records.push(dataObj);
            alert("မှတ်တမ်း အသစ်သိမ်းဆည်းပြီးပါပြီ။");
        }

        localStorage.setItem('mob_vehicle_records', JSON.stringify(records));
        clearInputs();
        renderTable();
    }

    // Render Data Table
    function renderTable() {
        const tbody = document.getElementById('recordTableBody');
        const search = document.getElementById('searchInput').value.toLowerCase();
        tbody.innerHTML = '';

        records.forEach((item, index) => {
            if (item.driverName.toLowerCase().includes(search) || item.userName.toLowerCase().includes(search)) {
                const tr = document.createElement('tr');
                tr.innerHTML = `
                    <td>${item.startKm}</td>
                    <td>${item.endKm}</td>
                    <td style="color:red; font-weight:bold;">${item.usedKm}</td>
                    <td>${item.fuelLiter}</td>
                    <td>${item.userName}</td>
                    <td>${item.driverName}</td>
                    <td>
                        <button class="action-btn edit-btn" onclick="editRecord(${index})">✏️</button>
                        <button class="action-btn del-btn" onclick="deleteRecord(${index})">🗑️</button>
                    </td>
                `;
                tbody.appendChild(tr);
            }
        });
    }

    // Edit Record
    function editRecord(index) {
        const item = records[index];
        document.getElementById('startKm').value = item.startKm;
        document.getElementById('endKm').value = item.endKm;
        document.getElementById('usedKm').value = item.usedKm;
        document.getElementById('fuelLiter').value = item.fuelLiter;
        document.getElementById('userName').value = item.userName;
        document.getElementById('driverName').value = item.driverName;
        
        editIndex = index;
        window.scrollTo({ top: 200, behavior: 'smooth' });
    }

    // Delete Record
    function deleteRecord(index) {
        if (confirm("ဤမှတ်တမ်းကို ဖျက်ရန် သေချာပါသလား?")) {
            records.splice(index, 1);
            localStorage.setItem('mob_vehicle_records', JSON.stringify(records));
            renderTable();
        }
    }

    // Clear Inputs
    function clearInputs() {
        document.getElementById('startKm').value = '';
        document.getElementById('endKm').value = '';
        document.getElementById('usedKm').value = '0';
        document.getElementById('fuelLiter').value = '';
        document.getElementById('userName').value = '';
        document.getElementById('driverName').value = '';
    }

    // Clear All Storage
    function clearAllData() {
        if (confirm("မှတ်တမ်း အားလုံးကို ဖျက်ပစ်ရန် သေချာပါသလား?")) {
            records = [];
            localStorage.removeItem('mob_vehicle_records');
            renderTable();
        }
    }

    // Backup Data (JSON Download)
    function exportData() {
        const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(records));
        const downloadAnchor = document.createElement('a');
        downloadAnchor.setAttribute("href", dataStr);
        downloadAnchor.setAttribute("download", "MOB_Vehicle_Records_Backup.json");
        document.body.appendChild(downloadAnchor);
        downloadAnchor.click();
        downloadAnchor.remove();
    }
</script>
</body>
</html>
